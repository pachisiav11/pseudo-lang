name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from `packageManager` in the root package.json.
      # Setting it here as well makes the action refuse to run.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm package

      # The tag must match the version in the manifest, or people download a
      # .vsix whose number does not match the release they took it from.
      - name: Check the tag matches the extension version
        run: |
          manifest=$(node -p "require('./packages/vscode/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "tag $tag does not match packages/vscode/package.json version $manifest" >&2
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/vscode/*.vsix
          generate_release_notes: true
          body: |
            ## Install

            You need [Visual Studio Code](https://code.visualstudio.com/) and
            [Node.js 20 or later](https://nodejs.org/). Both are free.

            1. Download **`pseudo-lang-${{ env.VERSION }}.vsix`** from the Assets list below.
            2. Open VS Code and press `Ctrl` `Shift` `X` (`Cmd` `Shift` `X` on a Mac).
            3. Click the `...` button at the top of that panel.
            4. Choose **Install from VSIX...** and pick the file you downloaded.

            Then make a file ending in `.pseudo` and press the **▷** button at the
            top right of the editor to run it, or `F5` to debug it.

            Prefer a terminal? `code --install-extension pseudo-lang-${{ env.VERSION }}.vsix`

            New to this? The step-by-step guide is at
            https://pachisiav11.github.io/pseudo-lang/ — it walks through every menu
            and covers what to do when something goes wrong.
